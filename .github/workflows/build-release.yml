name: build-release

# Non-tag pushes (main + pull requests) only verify that each platform builds.
# A pushed tag (v*) builds all platforms and publishes a GitHub Release with the
# artifacts and platform-specific usage notes.
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: write # required by softprops/action-gh-release to create releases

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Apple Silicon only (arm64), built natively on macos-14.
          - name: macOS arm64
            os: macos-14
            goarch: arm64
            platform: darwin
          - name: Windows x86_64
            os: windows-latest
            goarch: amd64
            platform: windows
          # - name: Linux x86_64
          #   os: ubuntu-24.04
          #   goarch: amd64
          #   platform: linux

    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.x'
          cache: true

      - name: Install Linux native build dependencies
        if: matrix.platform == 'linux'
        # Must come before any Go build step: the project (and Wails) compile
        # GTK4/WebKitGTK via cgo + pkg-config, so the dev headers have to be on
        # the system first. Wails v3 alpha defaults to the GTK4 + webkitgtk-6.0
        # build path (the !gtk3 branch); libwebkitgtk-6.0-dev is only on
        # Ubuntu 24.04+, hence ubuntu-24.04 as the runner.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-4-dev libwebkitgtk-6.0-dev \
            libayatana-appindicator3-dev \
            build-essential pkg-config

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.28

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: 3.x
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Test
        # gofmt only touches tracked files and the host arch; vet+test are
        # portable, so they validate every platform.
        run: wails3 task test

      # ------------------------------------------------------------------ #
      # Windows: the Taskfile generates a .syso for ARCH and removes it
      # afterwards, so package:windows honours GOARCH. The webview2 runtime is
      # present on the GitHub runner image; only the build is produced.
      # ------------------------------------------------------------------ #
      - name: Build (Windows)
        if: matrix.platform == 'windows'
        env:
          GOARCH: ${{ matrix.goarch }}
        run: wails3 task package:windows

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        env:
          GOARCH: ${{ matrix.goarch }}
        run: wails3 task package:linux

      # ------------------------------------------------------------------ #
      # macOS: package:darwin is the public entrypoint (build:darwin and
      # icons:darwin are internal). It builds the native arm64 binary, generates
      # the icon set, assembles bin/TinglyDS.app, and ad-hoc signs it. arm64 only.
      # ------------------------------------------------------------------ #
      - name: Build (macOS)
        if: matrix.platform == 'darwin'
        env:
          GOARCH: arm64
        run: wails3 task package:darwin

      - name: Archive macOS .app
        if: matrix.platform == 'darwin'
        run: |
          cd bin
          ditto -c -k --keepParent TinglyDS.app TinglyDS-macOS-arm64.zip

      - name: Upload macOS artifact
        if: matrix.platform == 'darwin'
        uses: actions/upload-artifact@v4
        with:
          name: build-macos
          path: bin/TinglyDS-macOS-arm64.zip
          if-no-files-found: error
          retention-days: 1

      - name: Stage Windows artifact
        if: matrix.platform == 'windows'
        run: |
          mkdir -p staging
          cp bin/tingly-ds.exe staging/

      - name: Upload Windows artifact
        if: matrix.platform == 'windows'
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: staging/tingly-ds.exe
          if-no-files-found: error
          retention-days: 1

      - name: Stage Linux artifact
        if: matrix.platform == 'linux'
        run: |
          mkdir -p staging
          cp bin/tingly-ds-*.AppImage staging/tingly-ds.AppImage

      - name: Upload Linux artifact
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: build-linux
          path: staging/tingly-ds.AppImage
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish release
    # Only tags publish. Non-tag pushes stop after verification.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Lay out release assets
        run: |
          mkdir -p release
          cp artifacts/build-macos/TinglyDS-macOS-arm64.zip release/
          cp artifacts/build-windows/tingly-ds.exe release/TinglyDS-Windows-x86_64.exe
          cp artifacts/build-linux/tingly-ds.AppImage release/TinglyDS-Linux-x86_64.AppImage
          ls -lR release

      - name: Generate release notes
        id: notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          bash .github/scripts/release-notes.sh "$TAG" > release/RELEASE_NOTES.md
          echo "path=release/RELEASE_NOTES.md" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          files: |
            release/TinglyDS-macOS-arm64.zip
            release/TinglyDS-Windows-x86_64.exe
            release/TinglyDS-Linux-x86_64.AppImage
          fail_on_unmatched_files: true
          generate_release_notes: false
